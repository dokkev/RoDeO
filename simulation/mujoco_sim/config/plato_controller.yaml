/plato/controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    wbc_controller:
      type: plato_controller/PlatoController

/plato/joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true

/plato/wbc_controller:
  ros__parameters:
    wbc_yaml_path: package://plato_controller/config/plato_wbc.yaml
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7
      - aristo_joint1
      - aristo_joint2
      - aristo_joint3
      - aristo_joint4
      - aristo_joint5
      - aristo_joint6
      - aristo_joint7
      - aristo_joint8
