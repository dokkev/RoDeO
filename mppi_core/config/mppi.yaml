mppi:
  # Rollout horizon in seconds = horizon_steps * dt.
  horizon_steps: 20
  dt: 0.01

  # Sampling budget and MPPI weighting temperature.
  num_rollouts: 128
  temperature: 1.0
  random_seed: 1

  # Action is delta_q_ref per MPPI step. Scalars expand to all controlled joints.
  action:
    lower_bound: -0.002
    upper_bound: 0.002
    noise_std: 0.002
