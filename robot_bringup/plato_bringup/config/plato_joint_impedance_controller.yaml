/plato/controller_manager:
  ros__parameters:
    update_rate: 300

    plato_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_impedance_controller:
      type: joint_impedance_controller/JointImpedanceController

/plato/plato_joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7
      - joint8

/plato/joint_impedance_controller:
  ros__parameters:
    compute_impedance_torque: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7
      - joint8
