linkage:
  L1: 30.0    # mm, PIP driving (input) linkage
  L2: 104.0   # mm, PIP coupler linkage
  L3: 30.0    # mm, PIP joint (output) linkage
  L4: 60.0    # mm, MCP linkage (input = output)
  L5: 44.0    # mm, MCP motor to PIP motor distance
  eef_length: 30.0  # mm, end effector length
  # PIP motor is zeroed at the position where PIP joint is at 0 deg (parallel proximal phalanx).
  # The five-bar linkage frame places this at 135 deg from the xy origin, so we apply this
  # offset to make both coordinate systems consistent.
  pip_motor_zero_angle_offset_deg: 135.0
