# =============================================================
# Optimo State Machine
# =============================================================
# State name is the factory key registered by the Optimo RobotControlProfile.
# References are generated by state params; the ROS controller does not route
# external joint/cartesian command topics into active states.

state_machine:
  - id: 0
    name: "initialize"
    duration: 2.0
    wait_time: 0.0
    stay_here: true
    params:
      target_jpos: [0.0, 3.14159, 0.0, -1.5708, 0.0, -1.5708, 0.0]
    tasks:
      - name: "jpos_task"
        weight: 100.0
      - name: "ee_task"
        weight: 1.0e-6

  - id: 2
    name: "joint_reference"
    stay_here: true
    tasks:
      - name: "jpos_task"
        weight: 100.0
      - name: "ee_task"
        weight: 1.0e-6

  - id: 3
    name: "cartesian_reference"
    stay_here: true
    params:
      task_name: "ee_task"
      linear_velocity: [0.0, 0.0, 0.0]
      angular_velocity: [0.0, 0.0, 0.0]
    tasks:
      - name: "ee_task"
        weight: 100.0
      - name: "jpos_task"
        weight: 1.0
