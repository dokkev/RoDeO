# =============================================================
# Ideal single-file WBC configuration example
# =============================================================
# This file is the target shape for the top-level control architecture:
#   YAML -> ConfigCompiler -> RuntimeAssembler -> IDProblemBuilder -> IDHQP
#
# The state machine selects active tasks/contacts. The builder snapshots those
# runtime objects into an IDProblem. IDHQP owns the solver hierarchy.
#
# YAML owns static structure: robot model, primitive pools, default levels,
# gains, weights, constraints, state selection, and state-machine references.
# Runtime code owns measured state and qddot_ref values.

schema: "wbc_control_architecture/v1"

robot_model:
  urdf_path: "package://optimo_description/urdf/optimo.urdf"
  is_floating_base: false
  base_frame: "optimo_base_link"

controller:
  dt: 0.001
  qddot_ref: false  # false => qddot_ref := 0, so delta_qddot_sol == qddot_sol
  kp_acc: 60.0
  kd_acc: 3.0

# IDHQP always uses a fixed HQP cascade hierarchy policy. This field selects
# only the inner QP backend used by that cascade, using TSID SolverHQP enum
# names such as SOLVER_HQP_EIQUADPROG, SOLVER_HQP_EIQUADPROG_FAST,
# SOLVER_HQP_EIQUADPROG_RT, or SOLVER_HQP_PROXQP when ProxSuite is available.
# qp_params are backend tuning knobs. The values below match the ProxQP-style
# parameters exposed by the copied TSID solver backend.
solver:
  type: SOLVER_HQP_PROXQP
  qp_params:
    max_iter: 1000
    rho: 1.0e-6
    mu_eq: 1.0e-3
    mu_ineq: 1.0e-1
    eps_abs: 1.0e-5
    eps_rel: 0.0
    verbose: false

regularization:
  w_delta_qddot: 0.01  # regularizes delta_qddot; if qddot_ref=false, qddot
  w_lambda: 1.0e-4     # regularizes contact reaction lambda; not force tracking

# Constraint primitives that can be attached to the assembled IDProblem.
# These are not task/contact selections and are not a separate global layer.
constraints:
  JointTorque:
    enabled: false
    scale: 1.0

# Contact objects are defined here, but they become active only when a state
# lists them under its contacts field. Contact consistency and force bounds are
# fixed hard constraints inside IDHQP; hard/soft is not a YAML option.
contact_pool:
  - name: "ee_contact"
    type: "PointContact"
    target_frame: "optimo_end_effector"
    mu: 0.5
    fMin: 1.0
    fMax: 200.0
    kp_contact: 100.0

# Task pool defines reusable primitives and their default objective policy.
# References are assigned by runtime state/controller code, not by the pool.
# weight is optional; when omitted it defaults to 1.0.
# States select active tasks and may optionally override weight.
task_pool:
  - name: "jpos_task"
    type: "JointTask"
    level: 2
    kp: 100.0
    kd: 10.0
    weight: 100.0  # optional

  # SE3Task uses TSID motion convention: [angular(3); linear(3)].
  # position/orientation toggle the linear/angular parts of the 6D task.
  - name: "ee_task"
    type: "SE3Task"
    level: 1
    target_frame: "optimo_end_effector"
    position: true
    orientation: true
    kp: [1000.0, 1000.0, 1000.0, 200.0, 200.0, 200.0]
    kd: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0]
    weight: 100.0  # optional

  # - name: "com_task"
  #   type: "ComTask"
  #   level: 1
  #   kp: 100.0
  #   kd: 10.0
  #   weight: 10.0  # optional

  # ForceTask is a lambda-space objective tied to an active contact.
  # Desired wrench/force references should come from the controller at runtime,
  # not from this static task definition. Leave commented until IDHQP force-task
  # objective wiring is enabled.
  # - name: "ee_force_task"
  #   type: "ForceTask"
  #   level: 1
  #   contact: "ee_contact"
  #   weight: 1.0  # optional

# State task selection can override both weight and level. weight only changes
# trade-off inside one strict-priority level; level moves the task to another
# HQP priority for that state.
state_machine:
  - id: 0
    name: "initialize"
    duration: 2.0
    wait_time: 0.0
    stay_here: true
    params:
      target_jpos: [0.0, 3.14159, 0.0, -1.5708, 0.0, -1.5708, 0.0]
    tasks:
      - "jpos_task"
      - name: "ee_task"
        # level: 2  # optional override; omit to use task_pool default
        weight: 1.0e-6  # optional override

debug:
  enabled: true
  print_interval: 5.0
