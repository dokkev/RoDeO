# =============================================================
# Optimo Task Pool  (wbc_core TSID format)
# =============================================================
# Scalar values are broadcast to all DOFs automatically.
# Pool weights serve as the default when a state doesn't override them.
#
# Task types: JointTask, LinkPosTask, LinkOriTask, ComTask
# Roles:      bias_task        → lower-priority solution selection preference
#             operational_task → tracked at WBMC operational level
# LinkPosTask creates a TaskSE3Equality masked to position (rows 0-2).
# LinkOriTask creates a TaskSE3Equality masked to orientation (rows 3-5).

task_pool:
  - name: "jpos_task"
    type: "JointTask"
    role: "bias_task"
    kp: 100.0
    kd: 10.0
    kp_ik: 1.0
    weight: 100.0

  - name: "ee_pos_task"
    type: "LinkPosTask"
    role: "operational_task"
    target_frame: "optimo_end_effector"
    kp: 200.0
    kd: 10.0
    kp_ik: 1.0
    weight: 100.0

  - name: "ee_ori_task"
    type: "LinkOriTask"
    role: "operational_task"
    target_frame: "optimo_end_effector"
    kp: 1000.0
    kd: 10.0
    kp_ik: 1.0
    weight: 100.0
