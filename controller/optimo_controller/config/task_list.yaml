# =============================================================
# Optimo Task Pool
# =============================================================
# Task pool entries are reusable primitives. Runtime state code owns the actual
# references. States can override task weight/level when selecting tasks.

task_pool:
  - name: "jpos_task"
    type: "JointTask"
    role: "bias_task"
    kp: 100.0
    kd: 10.0
    weight: 100.0

  - name: "ee_task"
    type: "SE3Task"
    role: "operational_task"
    target_frame: "optimo_end_effector"
    position: true
    orientation: true
    kp: [1000.0, 1000.0, 1000.0, 200.0, 200.0, 200.0]
    kd: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0]
    weight: 100.0
