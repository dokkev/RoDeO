# =============================================================
# Optimo WBC Configuration
# =============================================================
# Runtime flow:
#   YAML -> ConfigLoader -> ConfigCompiler -> RuntimeAssembler
#        -> ControlArchitecture -> IDProblemRegistry -> IDHQP
#
# YAML defines static structure and state-machine references. The ROS controller
# only selects states; active states own their task references from params.

schema: "wbc_control_architecture/v1"

robot_model:
  urdf_path: "package://optimo_description/urdf/optimo.urdf"
  is_floating_base: false
  base_frame: "optimo_base_link"

controller:
  dt: 0.001
  qddot_ref: false
  kp_acc: 60.0
  kd_acc: 3.0

# IDHQP always builds a cascade. This field only selects the inner QP backend.
solver:
  type: SOLVER_HQP_PROXQP
  qp_params:
    max_iter: 1000
    rho: 1.0e-6
    mu_eq: 1.0e-3
    mu_ineq: 1.0e-1
    eps_abs: 1.0e-5
    eps_rel: 0.0
    verbose: false

regularization:
  w_delta_qddot: 0.01
  w_lambda: 1.0e-4
  w_xc_ddot: 1.0e-3

constraints:
  JointTorque:
    enabled: false
    scale: 1.0

task_pool_yaml: "task_list.yaml"
state_machine_yaml: "state_machine.yaml"

debug:
  enabled: true
  print_interval: 5.0
