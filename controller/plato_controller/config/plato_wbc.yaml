# =============================================================
# Plato WBC Configuration (Optimo arm + Aristo hand)
# =============================================================

# 1. Robot model (URDF)
robot_model:
  urdf_path: "package://plato_description/urdf/plato.urdf"
  is_floating_base: false
  base_frame: "link0"

# 2. Feedforward Controller (WBC) Settings
controller:
  enable_gravity_compensation:  true
  enable_coriolis_compensation: true
  enable_inertia_compensation:  true

  ik_method: "weighted_qp"
  kp_acc: 60.0
  kd_acc: 3.0

  joint_pid:
    enabled: false

# 3. QP Regularization weights
regularization:
  w_qddot: 0.01
  w_tau: 0.0
  w_tau_dot: 0.0
  w_rf: 1.0e-4
  w_xc_ddot: 1.0e-3
  w_f_dot: 1.0e-3

# 4. Global constraints
global_constraints:
  JointPosLimitConstraint:
    enabled: false
    scale: 1.0
    is_soft: true
    soft_weight: 1.0e+5

  JointVelLimitConstraint:
    enabled: false
    scale: 1.0
    is_soft: true
    soft_weight: 1.0e+5

  JointTrqLimitConstraint:
    enabled: false
    scale: 1.0
    is_soft: false
    soft_weight: 1.0e+5

# 5. Debug mode
debug_mode: false
debug_print_interval: 5.0

# 6. Task and state machine definitions
task_pool_yaml: "task_list.yaml"
state_machine_yaml: "state_machine.yaml"
