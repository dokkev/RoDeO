# =============================================================
# Plato Task Pool (Optimo arm + Aristo hand)
# =============================================================
# 15 DOF: joint1-7 (arm) + aristo_joint1-8 (hand)
# Scalar values are broadcast to all DOFs automatically.

weight_min: 1.0e-6
weight_max: 1.0e+4

task_pool:
  # --- Joint posture task (all 15 joints) ---
  - name: "jpos_task"
    type: "JointTask"
    role: "posture_task"
    kp: 100.0
    kd: 10.0
    kp_ik: 1.0
    weight: 100.0

  # --- EE position (Optimo end_effector = wrist) ---
  - name: "ee_pos_task"
    type: "LinkPosTask"
    role: "operational_task"
    target_frame: "end_effector"
    reference_frame: "link0"
    kp: 200.0
    kd: 10.0
    kp_ik: 1.0
    weight: 100.0

  # --- EE orientation (Optimo end_effector = wrist) ---
  - name: "ee_ori_task"
    type: "LinkOriTask"
    role: "operational_task"
    target_frame: "end_effector"
    reference_frame: "link0"
    kp: 200.0
    kd: 10.0
    kp_ik: 1.0
    weight: 100.0

  # --- Index fingertip position ---
  - name: "finger_pos_task"
    type: "LinkPosTask"
    role: "operational_task"
    target_frame: "aristo_index_fingertip"
    reference_frame: "link0"
    kp: 200.0
    kd: 10.0
    kp_ik: 1.0
    weight: 100.0

  # --- Index fingertip orientation ---
  - name: "finger_ori_task"
    type: "LinkOriTask"
    role: "operational_task"
    target_frame: "aristo_index_fingertip"
    reference_frame: "link0"
    kp: 200.0
    kd: 10.0
    kp_ik: 1.0
    weight: 100.0
